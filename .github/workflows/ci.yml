name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the job token out of .git/config so dependency lifecycle
          # scripts can't read it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --include=dev

      - name: Install Casper SSH mobile dependencies
        run: npm --prefix packages/casper-ssh-mobile ci --include=dev

      - name: Typecheck
        run: npm run lint

      - name: Typecheck Casper SSH mobile
        run: npm run lint:mobile

      - name: Test
        run: npm run test:run

      - name: Test Casper SSH mobile
        run: npm run test:mobile

      - name: Build
        run: npm run build
